name: Deploy Plutus

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Setup Secrets
        env:
          PLUTUS_MCP_TOKEN: ${{ secrets.PLUTUS_MCP_TOKEN }}
          PLUTUS_DB_PASSWORD: ${{ secrets.PLUTUS_DB_PASSWORD }}
          PLUTUS_WEBHOOK_SECRET: ${{ secrets.PLUTUS_WEBHOOK_SECRET }}
        run: |
          if [ -z "${PLUTUS_MCP_TOKEN}" ]; then
            echo "Error: PLUTUS_MCP_TOKEN secret is required" >&2
            exit 1
          fi
          if [ -z "${PLUTUS_DB_PASSWORD}" ]; then
            echo "Error: PLUTUS_DB_PASSWORD secret is required" >&2
            exit 1
          fi
          if [ -z "${PLUTUS_WEBHOOK_SECRET}" ]; then
            echo "Error: PLUTUS_WEBHOOK_SECRET secret is required" >&2
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "PLUTUS_MCP_TOKEN_NAME=$(echo "$PLUTUS_MCP_TOKEN" | /tmp/ensure_secret.sh plutus_mcp_token)" >> $GITHUB_ENV
          echo "PLUTUS_DB_PASSWORD_NAME=$(printf '%s' "$PLUTUS_DB_PASSWORD" | /tmp/ensure_secret.sh plutus_db_password)" >> $GITHUB_ENV
          echo "PLUTUS_WEBHOOK_SECRET_NAME=$(printf '%s' "$PLUTUS_WEBHOOK_SECRET" | /tmp/ensure_secret.sh plutus_webhook_secret)" >> $GITHUB_ENV

      - name: Prepare host data directory
        env:
          PLUTUS_DB_MOUNT_PATH: ${{ vars.PLUTUS_DB_MOUNT_PATH }}
        run: |
          DB_DIR="${PLUTUS_DB_MOUNT_PATH:-/opt/plutus/data}"
          docker run --rm -v "${DB_DIR}":/data alpine mkdir -p /data

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          PLUTUS_MCP_TOKEN: ${{ secrets.PLUTUS_MCP_TOKEN }}
          PLUTUS_DB_PASSWORD: ${{ secrets.PLUTUS_DB_PASSWORD }}
          PLUTUS_WEBHOOK_SECRET: ${{ secrets.PLUTUS_WEBHOOK_SECRET }}
          PLUTUS_DBS_ACCOUNT_MAP: ${{ vars.PLUTUS_DBS_ACCOUNT_MAP }}
          PLUTUS_OWN_ACCOUNT_SUFFIXES: ${{ vars.PLUTUS_OWN_ACCOUNT_SUFFIXES }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_WEALTH_ID: ${{ vars.DISCORD_CHANNEL_WEALTH_ID }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          PLUTUS_JEV_MODEL: ${{ vars.PLUTUS_JEV_MODEL || 'jev-decision' }}
          PLUTUS_SYNC_INTERVAL_HOURS: ${{ vars.PLUTUS_SYNC_INTERVAL_HOURS || '6' }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$REGISTRY_PREFIX" ] && MISSING="$MISSING REGISTRY_PREFIX"
          [ -z "$PLUTUS_MCP_TOKEN" ] && MISSING="$MISSING PLUTUS_MCP_TOKEN"
          [ -z "$PLUTUS_DB_PASSWORD" ] && MISSING="$MISSING PLUTUS_DB_PASSWORD"
          [ -z "$PLUTUS_WEBHOOK_SECRET" ] && MISSING="$MISSING PLUTUS_WEBHOOK_SECRET"
          [ -z "$PLUTUS_DBS_ACCOUNT_MAP" ] && MISSING="$MISSING PLUTUS_DBS_ACCOUNT_MAP"
          [ -z "$PLUTUS_OWN_ACCOUNT_SUFFIXES" ] && MISSING="$MISSING PLUTUS_OWN_ACCOUNT_SUFFIXES"
          [ -z "$MUNINN_MASTER_KEY" ] && MISSING="$MISSING MUNINN_MASTER_KEY"
          [ -z "$DISCORD_BOT_TOKEN" ] && MISSING="$MISSING DISCORD_BOT_TOKEN"
          [ -z "$DISCORD_CHANNEL_WEALTH_ID" ] && MISSING="$MISSING DISCORD_CHANNEL_WEALTH_ID"
          [ -z "$DISCORD_USER_ID" ] && MISSING="$MISSING DISCORD_USER_ID"
          [ -z "$PLUTUS_JEV_MODEL" ] && MISSING="$MISSING PLUTUS_JEV_MODEL"
          [ -z "$PLUTUS_SYNC_INTERVAL_HOURS" ] && MISSING="$MISSING PLUTUS_SYNC_INTERVAL_HOURS"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Build and Deploy with Docker Compose
        env:
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          PLUTUS_DB_MOUNT_PATH: ${{ vars.PLUTUS_DB_MOUNT_PATH || '/opt/plutus/data' }}
          PLUTUS_DBS_ACCOUNT_MAP: ${{ vars.PLUTUS_DBS_ACCOUNT_MAP }}
          PLUTUS_OWN_ACCOUNT_SUFFIXES: ${{ vars.PLUTUS_OWN_ACCOUNT_SUFFIXES }}
          PLUTUS_LLM_BASE_URL: ${{ vars.PLUTUS_LLM_BASE_URL || 'http://muninn:4000/v1' }}
          PLUTUS_LLM_API_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          PLUTUS_LLM_MODEL: ${{ vars.PLUTUS_LLM_MODEL || 'app-synthesize' }}
          PLUTUS_RECEIPT_LLM_MODEL: ${{ vars.PLUTUS_RECEIPT_LLM_MODEL || 'gemini-4-hydrogen' }}
          PLUTUS_JEV_MODEL: ${{ vars.PLUTUS_JEV_MODEL || 'jev-decision' }}
          PLUTUS_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PLUTUS_DISCORD_WEALTH_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_WEALTH_ID }}
          PLUTUS_DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          PLUTUS_AKAHU_APP_TOKEN: ${{ secrets.AKAHU_APP_TOKEN }}
          PLUTUS_AKAHU_USER_TOKEN: ${{ secrets.AKAHU_USER_TOKEN }}
          PLUTUS_WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
          PLUTUS_BTC_WATCH_SOURCES: ${{ secrets.PLUTUS_BTC_WATCH_SOURCES }}
          PLUTUS_SYNC_INTERVAL_HOURS: ${{ vars.PLUTUS_SYNC_INTERVAL_HOURS || '6' }}
          IMAGE_TAG: plutus
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "plutus" docker-compose.yml

      - name: Verify Post-Deploy Swarm Convergence
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/verify_convergence.sh -o /tmp/verify_convergence.sh
          chmod +x /tmp/verify_convergence.sh
          /tmp/verify_convergence.sh "plutus" plutus_plutus-api plutus_plutus-db
