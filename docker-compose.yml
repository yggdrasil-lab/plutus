services:
  plutus-db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    stop_signal: SIGINT
    stop_grace_period: 60s
    environment:
      - POSTGRES_USER=plutus
      - POSTGRES_DB=plutus
      - POSTGRES_PASSWORD_FILE=/run/secrets/plutus_db_password
      - TZ=Pacific/Auckland
    volumes:
      - ${PLUTUS_DB_MOUNT_PATH}:/var/lib/postgresql/data
    secrets:
      - plutus_db_password
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U plutus -d plutus" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  plutus-api:
    image: ${REGISTRY_PREFIX}plutus-api:${IMAGE_TAG}
    build: ./api
    environment:
      - PLUTUS_DB_HOST=plutus-db
      - PLUTUS_DB_PORT=5432
      - PLUTUS_DB_NAME=plutus
      - PLUTUS_DB_USER=plutus
      - PLUTUS_DB_PASSWORD_FILE=/run/secrets/plutus_db_password
      - PLUTUS_ENVIRONMENT=production
      - PLUTUS_MCP_TOKEN_FILE=/run/secrets/plutus_mcp_token
      - PLUTUS_WEBHOOK_SECRET_FILE=/run/secrets/plutus_webhook_secret
      - PLUTUS_DBS_ACCOUNT_MAP=${PLUTUS_DBS_ACCOUNT_MAP}
      - PLUTUS_OWN_ACCOUNT_SUFFIXES=${PLUTUS_OWN_ACCOUNT_SUFFIXES}
      - PLUTUS_LLM_BASE_URL=${PLUTUS_LLM_BASE_URL}
      - PLUTUS_LLM_API_KEY=${PLUTUS_LLM_API_KEY}
      - PLUTUS_LLM_MODEL=${PLUTUS_LLM_MODEL}
      - PLUTUS_RECEIPT_LLM_MODEL=${PLUTUS_RECEIPT_LLM_MODEL}
      - PLUTUS_DISCORD_BOT_TOKEN=${PLUTUS_DISCORD_BOT_TOKEN}
      - PLUTUS_DISCORD_WEALTH_CHANNEL_ID=${PLUTUS_DISCORD_WEALTH_CHANNEL_ID}
      - PLUTUS_DISCORD_USER_ID=${PLUTUS_DISCORD_USER_ID}
      - PLUTUS_AKAHU_APP_TOKEN=${PLUTUS_AKAHU_APP_TOKEN}
      - PLUTUS_AKAHU_USER_TOKEN=${PLUTUS_AKAHU_USER_TOKEN}
      - PLUTUS_WISE_API_TOKEN=${PLUTUS_WISE_API_TOKEN}
      - PLUTUS_BTC_WATCH_SOURCES=${PLUTUS_BTC_WATCH_SOURCES}
      - PLUTUS_SYNC_INTERVAL_HOURS=${PLUTUS_SYNC_INTERVAL_HOURS}
      - TZ=Pacific/Auckland
    secrets:
      - plutus_mcp_token
      - plutus_db_password
      - plutus_webhook_secret
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        # Authentik SSO for web/browser API requests under /api/*
        - "traefik.http.routers.plutus-api.rule=(Host(`plutus.${DOMAIN_NAME}`) || Host(`midas.${DOMAIN_NAME}`)) && PathPrefix(`/api`)"
        - "traefik.http.routers.plutus-api.entrypoints=websecure"
        - "traefik.http.routers.plutus-api.tls=true"
        - "traefik.http.routers.plutus-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-api.priority=20"
        - "traefik.http.routers.plutus-api.service=plutus-api"
        - "traefik.http.routers.plutus-api.middlewares=authentik@docker,plutus-api-strip"
        - "traefik.http.middlewares.plutus-api-strip.stripprefix.prefixes=/api"
        # Machine-to-machine integrations endpoint (iOS Shortcuts, Siri, Apple Pay webhooks)
        - "traefik.http.routers.plutus-integrations.rule=Host(`plutus.${DOMAIN_NAME}`) && PathPrefix(`/integrations`)"
        - "traefik.http.routers.plutus-integrations.entrypoints=websecure"
        - "traefik.http.routers.plutus-integrations.tls=true"
        - "traefik.http.routers.plutus-integrations.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-integrations.middlewares=plutus-strip-authentik"
        - "traefik.http.middlewares.plutus-strip-authentik.headers.customrequestheaders.X-authentik-username="
        - "traefik.http.middlewares.plutus-strip-authentik.headers.customrequestheaders.X-authentik-email="
        - "traefik.http.middlewares.plutus-strip-authentik.headers.customrequestheaders.X-authentik-groups="
        - "traefik.http.middlewares.plutus-strip-authentik.headers.customrequestheaders.X-authentik-name="
        - "traefik.http.middlewares.plutus-strip-authentik.headers.customrequestheaders.X-authentik-uid="
        - "traefik.http.routers.plutus-integrations.service=plutus-api"
        # Machine-to-machine MCP endpoint for Hermes Agent and Antigravity
        - "traefik.http.routers.plutus-mcp.rule=Host(`plutus.${DOMAIN_NAME}`) && PathPrefix(`/mcp`)"
        - "traefik.http.routers.plutus-mcp.entrypoints=websecure"
        - "traefik.http.routers.plutus-mcp.tls=true"
        - "traefik.http.routers.plutus-mcp.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-mcp.service=plutus-api"
        - "traefik.http.services.plutus-api.loadbalancer.server.port=8000"
        - "traefik.docker.network=aether-net"

secrets:
  plutus_mcp_token:
    external: true
    name: ${PLUTUS_MCP_TOKEN_NAME}
  plutus_db_password:
    external: true
    name: ${PLUTUS_DB_PASSWORD_NAME}
  plutus_webhook_secret:
    external: true
    name: ${PLUTUS_WEBHOOK_SECRET_NAME}

networks:
  aether-net:
    external: true
