services:
  plutus-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=plutus
      - POSTGRES_DB=plutus
      - POSTGRES_PASSWORD=plutus
      - TZ=Pacific/Auckland
    volumes:
      - ${PLUTUS_DB_MOUNT_PATH}:/var/lib/postgresql/data
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plutus -d plutus"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  plutus-api:
    image: ${REGISTRY_PREFIX}plutus-api:${IMAGE_TAG}
    build: ./api
    environment:
      - PLUTUS_DATABASE_URL=postgresql+psycopg://plutus:plutus@plutus-db:5432/plutus
      - PLUTUS_ENVIRONMENT=production
      - PLUTUS_MCP_TOKEN_FILE=/run/secrets/plutus_mcp_token
      - TZ=Pacific/Auckland
    secrets:
      - plutus_mcp_token
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        # Authentik SSO for web/browser API requests under /api/*
        - "traefik.http.routers.plutus-api.rule=Host(`plutus.${DOMAIN_NAME}`) && PathPrefix(`/api`)"
        - "traefik.http.routers.plutus-api.entrypoints=websecure"
        - "traefik.http.routers.plutus-api.tls=true"
        - "traefik.http.routers.plutus-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-api.middlewares=authentik@docker,plutus-api-strip"
        - "traefik.http.middlewares.plutus-api-strip.stripprefix.prefixes=/api"
        # Machine-to-machine integrations endpoint (iOS Shortcuts, Siri, Apple Pay webhooks)
        - "traefik.http.routers.plutus-integrations.rule=Host(`plutus.${DOMAIN_NAME}`) && PathPrefix(`/integrations`)"
        - "traefik.http.routers.plutus-integrations.entrypoints=websecure"
        - "traefik.http.routers.plutus-integrations.tls=true"
        - "traefik.http.routers.plutus-integrations.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-integrations.service=plutus-api"
        # Machine-to-machine MCP endpoint for Hermes Agent and Antigravity
        - "traefik.http.routers.plutus-mcp.rule=Host(`plutus.${DOMAIN_NAME}`) && PathPrefix(`/mcp`)"
        - "traefik.http.routers.plutus-mcp.entrypoints=websecure"
        - "traefik.http.routers.plutus-mcp.tls=true"
        - "traefik.http.routers.plutus-mcp.tls.certresolver=cloudflare"
        - "traefik.http.routers.plutus-mcp.service=plutus-api"
        - "traefik.http.services.plutus-api.loadbalancer.server.port=8000"
        - "traefik.docker.network=aether-net"

secrets:
  plutus_mcp_token:
    external: true
    name: ${PLUTUS_MCP_TOKEN_NAME}

networks:
  aether-net:
    external: true
